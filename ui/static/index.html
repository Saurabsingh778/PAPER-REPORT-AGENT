<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Report Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M9.5 5h5M10.5 5v5L6.8 16.5a1.6 1.6 0 0 0 1.4 2.5h7.6a1.6 1.6 0 0 0 1.4-2.5L13.5 10V5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f8;--panel:#ffffff;--panel2:#f8f9fb;--line:#e3e6ec;--line2:#edeff3;
  --text:#0f172a;--muted:#5b6679;--faint:#8b95a7;
  --accent:#4f46e5;--accent2:#6366f1;--accent-weak:#eceeff;--on-accent:#fff;
  --ok:#0f7a55;--ok-bg:#e3f5ed;--warn:#a85b00;--warn-bg:#fff1d9;--bad:#bd2430;--bad-bg:#fde8e9;
  --info:#0b6a9a;--info-bg:#e2f1fa;--violet:#6a3fd1;--violet-bg:#eee8fd;--gray-bg:#eceef2;
  --console:#0d1117;--console-text:#c9d1d9;--console-dim:#6e7681;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.04);
  --shadow-lg:0 12px 40px rgba(15,23,42,.14);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#090c12;--panel:#10141c;--panel2:#141a24;--line:#222a38;--line2:#1a212d;
  --text:#e8ecf3;--muted:#98a3b6;--faint:#667189;
  --accent:#8f96ff;--accent2:#7c85ff;--accent-weak:#1a1f3f;--on-accent:#0b0e1a;
  --ok:#3ddc9e;--ok-bg:#0e2a21;--warn:#f5b84b;--warn-bg:#2c2109;--bad:#ff8087;--bad-bg:#2e1317;
  --info:#58b9ee;--info-bg:#0c2432;--violet:#b49cff;--violet-bg:#231b40;--gray-bg:#1b2230;
  --console:#070a0f;--console-text:#c9d1d9;--console-dim:#5d6676;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 2px 10px rgba(0,0,0,.25);--shadow-lg:0 12px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,pre,.mono{font-family:var(--mono)}
.ic{display:inline-flex;vertical-align:middle;flex:none}.ic svg{display:block}

/* ---------- shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;background:var(--panel);border-right:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent2),#8b5cf6);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(99,102,241,.35)}
.brand b{display:block;font-size:14px;letter-spacing:-.01em;line-height:1.15}
.brand span{font-size:11.5px;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;text-decoration:none}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--accent-weak);color:var(--accent)}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--gray-bg);color:var(--muted);padding:1px 7px;border-radius:99px}
.nav a.on .count{background:transparent;color:var(--accent)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:auto;box-shadow:0 0 0 0 var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,.55)}70%{box-shadow:0 0 0 8px rgba(99,102,241,0)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
.side .grow{flex:1}
.side .foot{font-size:11.5px;color:var(--faint);padding:10px 8px 0;border-top:1px solid var(--line2);word-break:break-all}
.side .foot b{color:var(--muted);font-weight:600;display:block;margin-bottom:2px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);min-height:58px}
.top h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:650}
.crumb{color:var(--faint);font-size:13px}
.top .sp{flex:1}
.conn{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.conn.ok i{background:var(--ok)}.conn.demo i{background:var(--warn)}.conn.bad i{background:var(--bad)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--faint)}
.page{padding:26px 32px 64px;max-width:1320px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;border:1px solid}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.info{background:var(--accent-weak);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.banner a{font-weight:600;text-decoration:underline}

/* ---------- primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.card-h h2,.card-h h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.005em}
.card-h .sub{color:var(--faint);font-size:12.5px}.card-h .sp{flex:1}
.card-b{padding:18px}
.grid{display:grid;gap:18px}.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;font-weight:550;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--faint);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.lg{padding:12px 20px;font-size:14.5px;border-radius:11px}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;box-shadow:none}
.seg{display:inline-flex;background:var(--gray-bg);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:550;display:inline-flex;gap:7px;align-items:center}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.switch{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:.15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.switch.on{background:var(--accent)}.switch.on::after{left:19px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gray-bg);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}.chip.violet{background:var(--violet-bg);color:var(--violet)}.chip.accent{background:var(--accent-weak);color:var(--accent)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}.kv dt{color:var(--faint)}.kv dd{margin:0;min-width:0;word-break:break-word}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 20px;overflow-x:auto}
.tabs a{padding:10px 14px;color:var(--muted);font-weight:550;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none;display:flex;gap:8px;align-items:center}
.tabs a:hover{color:var(--text)}.tabs a.on{color:var(--accent);border-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--gray-bg);border-radius:99px;padding:0 7px;color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--faint)}
.empty .ic{opacity:.5;margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;font-weight:650;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--panel2)}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;border-radius:99px;background:var(--gray-bg);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.codebox{font:12.5px/1.55 var(--mono);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.spin{width:14px;height:14px;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;right:22px;bottom:22px;z-index:90;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-weight:550;max-width:420px}

/* ---------- new run */
.drop{border:2px dashed var(--line);border-radius:14px;padding:38px 20px;text-align:center;cursor:pointer;background:var(--panel2);transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-weak)}
.drop .big{width:52px;height:52px;border-radius:14px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.drop h3{margin:0 0 4px;font-size:15px}
.file{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.file .big{width:42px;height:42px;border-radius:10px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;flex:none;font-size:10.5px;font-weight:800}
.opt{display:grid;grid-template-columns:200px 1fr;gap:6px 24px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.opt:last-child{border-bottom:0}
.opt b{font-weight:600}.opt p{margin:2px 0 0;color:var(--faint);font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.check:last-child{border:0}
.check .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.check .dot.ok{background:var(--ok-bg);color:var(--ok)}.check .dot.bad{background:var(--bad-bg);color:var(--bad)}.check .dot.warn{background:var(--warn-bg);color:var(--warn)}.check .dot.wait{background:var(--gray-bg);color:var(--faint)}
.check b{font-weight:600;display:block}.check span{color:var(--muted);font-size:12.5px;word-break:break-word}
.flow{display:flex;flex-direction:column;gap:0}
.flow>div{display:flex;gap:12px;padding:8px 0;position:relative}
.flow>div:not(:last-child)::before{content:"";position:absolute;left:13px;top:34px;bottom:-6px;width:1px;background:var(--line)}
.flow .n{width:27px;height:27px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.flow b{display:block;font-size:13px}.flow span{color:var(--faint);font-size:12.5px}

/* ---------- live */
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stage{position:relative;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);transition:.2s}
.stage .top2{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.stage .badge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--gray-bg);color:var(--faint);flex:none}
.stage h4{margin:0;font-size:13.5px}.stage p{margin:0;color:var(--faint);font-size:12.5px;min-height:36px}
.stage .st{margin-top:10px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;color:var(--faint)}
.stage .msg{font-weight:400;color:var(--muted);font-size:12px;margin-top:4px;word-break:break-word}
.stage.running{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent),var(--shadow)}
.stage.running .badge{background:var(--accent-weak);color:var(--accent)}.stage.running .st{color:var(--accent)}
.stage.done .badge{background:var(--ok-bg);color:var(--ok)}.stage.done .st{color:var(--ok)}
.stage.reused .badge{background:var(--info-bg);color:var(--info)}.stage.reused .st{color:var(--info)}
.stage.failed{border-color:var(--bad)}.stage.failed .badge{background:var(--bad-bg);color:var(--bad)}.stage.failed .st{color:var(--bad)}
.stage:not(:last-child)::after{content:"";position:absolute;right:-15px;top:30px;width:16px;height:2px;background:var(--line)}
.stage.done:not(:last-child)::after{background:var(--ok)}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.sstep{display:flex;gap:7px;align-items:center;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:550;background:var(--gray-bg);color:var(--faint)}
.sstep.active{background:var(--accent-weak);color:var(--accent)}.sstep.done{background:var(--ok-bg);color:var(--ok)}.sstep.skip{opacity:.5;text-decoration:line-through}
.console{background:var(--console);color:var(--console-text);border-radius:0 0 var(--r) var(--r);height:430px;overflow:auto;font:12.5px/1.6 var(--mono);padding:10px 0}
.console .ln{padding:0 16px;white-space:pre-wrap;word-break:break-word;display:flex;gap:12px}
.console .ln:hover{background:rgba(255,255,255,.04)}
.console .ts{color:var(--console-dim);flex:none;user-select:none}
.console .hl{color:#a5b4fc;font-weight:700}.console .err{color:#ff8b92}.console .warn{color:#f5c26b}.console .step{color:#6ee7b7}.console .dim{color:var(--console-dim)}
.console .none{color:var(--console-dim);padding:20px 16px}
.tl{display:flex;flex-direction:column;max-height:430px;overflow:auto}
.tl>div{display:flex;gap:11px;padding:9px 18px;border-bottom:1px solid var(--line2);font-size:12.5px}
.tl>div:last-child{border:0}
.tl time{color:var(--faint);font-family:var(--mono);font-size:11.5px;flex:none;width:58px;padding-top:1px}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;line-height:1.25}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font-size:25px;letter-spacing:-.03em}.ring .c span{font-size:11.5px;color:var(--faint)}
.kpi{padding:16px 18px}.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}.kpi .l{color:var(--faint);font-size:12.5px;margin-top:4px}
.dets td{background:var(--panel2)!important}
.det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;padding:6px 4px}
.det h5{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.step-card{padding:16px 18px;border-bottom:1px solid var(--line2)}.step-card:last-child{border:0}
.ev{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-top:6px;color:var(--muted)}
.ev .chip{font-size:10.5px;padding:1px 7px;flex:none}
.fig{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fig img{width:100%;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;padding:6px}
.lightbox{position:fixed;inset:0;background:rgba(5,8,14,.86);z-index:100;display:grid;place-items:center;padding:30px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.md{font-size:14px;line-height:1.65;max-width:900px}
.md h1{font-size:22px;letter-spacing:-.02em}.md h2{font-size:18px;margin-top:1.6em;padding-bottom:.3em;border-bottom:1px solid var(--line2)}.md h3{font-size:15px;margin-top:1.4em}
.md code{background:var(--panel2);border:1px solid var(--line2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.md pre{background:var(--panel2);border:1px solid var(--line2);padding:12px;border-radius:8px;overflow:auto}.md pre code{border:0;padding:0;background:none}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:12px 0}.md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left}.md th{background:var(--panel2)}
.md img{max-width:100%;border-radius:8px}.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--muted)}
.ftree summary{cursor:pointer;padding:9px 18px;font-weight:600;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line2);list-style:none}
.ftree summary::-webkit-details-marker{display:none}
.frow{display:flex;gap:12px;align-items:center;padding:7px 18px 7px 44px;border-bottom:1px solid var(--line2);font-size:12.5px}
.frow .p{flex:1;min-width:0;word-break:break-all;font-family:var(--mono)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 11px;color:var(--faint)}
.search input{border:0;outline:0;background:transparent;min-width:160px;color:var(--text)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:550;color:var(--muted)}
.filters button.on{background:var(--accent-weak);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
@media(max-width:1100px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.rail{grid-template-columns:1fr 1fr}.stage::after{display:none!important}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 14px;overflow-x:auto}
  .brand{padding:0}.brand span,.side .foot,.side .grow{display:none}.nav{flex-direction:row}
  .top,.page{padding-left:16px;padding-right:16px}.g2,.g2e,.g3,.g4,.det,.rail{grid-template-columns:1fr}.opt{grid-template-columns:1fr}
}

      h('a', { class: 'btn sm', href: fileUrl(run, 'report.md', true) }, ic('download', 13), 'report.md'), h('a', { class: 'btn sm', href: fileUrl(run, 'report.json', true) }, ic('download', 13), 'report.json')),
      h('div', { class: 'card-b' }, mdToDom(md, { run, base: '' })))).catch(() => mount(box, h('div', { class: 'empty' }, ic('info', 30), 'No report.md yet.')));
    return box;
  }

  /* ---- files */
  function tFiles() {
    const box = h('div', { class: 'card' }, h('div', { class: 'empty' }, h('span', { class: 'spin' })));
    api.tree(slug, runId).then(t => {
      const groups = {}; t.files.forEach(f => { const p = f.path.includes('/') ? f.path.split('/')[0] : '(run folder)'; (groups[p] = groups[p] || []).push(f); });
      const order = Object.keys(groups).sort((a, b) => a === '(run folder)' ? -1 : b === '(run folder)' ? 1 : a.localeCompare(b));
      mount(box, h('div', { class: 'card-h' }, h('h3', {}, 'Run folder'), h('span', { class: 'sub mono' }, `${slug}/${runId}`)),
        h('div', { class: 'ftree' }, order.map(g => h('details', { open: g === '(run folder)' || g === 'logs' },
          h('summary', {}, ic('folder', 16), g, h('span', { class: 'chip', style: { marginLeft: 'auto' } }, groups[g].length)),
          groups[g].slice(0, 400).map(f => h('div', { class: 'frow' }, h('span', { class: 'p' }, f.path), h('span', { class: 'faint tiny num' }, fmtBytes(f.size)),
            h('a', { href: fileUrl(run, f.path), target: '_blank', rel: 'noopener', title: 'Open' }, ic('ext', 14)), h('a', { href: fileUrl(run, f.path, true), title: 'Download' }, ic('download', 14)))),
          groups[g].length > 400 ? h('div', { class: 'frow faint' }, `… ${groups[g].length - 400} more`) : null))),
        t.truncated ? h('div', { class: 'card-b faint small' }, 'Listing truncated at 3000 files.') : null);
    }).catch(() => mount(box, h('div', { class: 'empty' }, 'Could not list files.')));
    return box;
  }
}

/* ============================================================ boot */
route();
setInterval(async () => {          // keep the sidebar's "Live run" indicator honest
  const was = S.health && S.health.active_job && S.health.active_job.id;
  await refreshHealth();
  const now = S.health && S.health.active_job && S.health.active_job.id;
  if (was !== now) refreshNav();
  if (was !== now && !location.hash.startsWith('#/live') && !location.hash.startsWith('#/new')) { await refreshRuns(); route(); }
}, 5000);
</script>
